name: Android Build and Rules Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Rules regression and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run DominoMada rules regression
        run: |
          mkdir -p "$RUNNER_TEMP/rules-tests"
          javac --release 17 -d "$RUNNER_TEMP/rules-tests" \
            "app/src/main/java/com/madamgames/dominomada/DominoGame.java" \
            "tests/DominoGameTest.java"
          java -cp "$RUNNER_TEMP/rules-tests" "com.madamgames.dominomada.DominoGameTest"

      - name: Assemble Android debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dominomada-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
